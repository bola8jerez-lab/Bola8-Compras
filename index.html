<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><meta name="description" content="Control local de compras de Bola 8"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Bola 8 Compras</title>
<style>
:root{color-scheme:dark;--bg:#101820;--card:#1c2933;--card2:#253743;--text:#f3f7fa;--muted:#a9bac5;--accent:#65b9e8;--line:#344753;--danger:#ff9999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif;padding-bottom:85px}.app{max-width:760px;margin:auto;padding:18px 15px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--text);padding:11px 14px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0d151c;color:var(--text)}label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.field{margin:12px 0}.primary{background:var(--accent);color:#09202c;border-color:var(--accent);font-weight:800}.danger{color:var(--danger)}.brand{font-size:20px;font-weight:850}.brand b{color:var(--accent)}.muted,.small{color:var(--muted);font-size:13px}.top,.row,.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.top{margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.hero{padding:22px}.hero h1{font-size:27px;line-height:1.15;margin:6px 0}.sectionhead{margin:22px 0 10px}.sectionhead h2,.card h2{font-size:18px;margin:0}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.itemmain{flex:1;min-width:0}.itemname{font-weight:750;overflow-wrap:anywhere}.price{font-weight:850;white-space:nowrap}.empty{text-align:center;padding:25px 12px;color:var(--muted)}.notice{border-left:3px solid var(--accent);background:#162630;border-radius:8px;padding:10px 12px;color:var(--muted);font-size:13px}.warn{border-color:#f0bc65}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.total{background:var(--accent);color:#09202c;border-radius:13px;padding:14px 16px;display:flex;justify-content:space-between;font-weight:850;margin-top:14px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:3px;background:#111c24f5;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:4}.nav button{flex:1;max-width:145px;border:0;background:transparent;color:var(--muted);padding:8px 2px;font-size:12px}.nav button.active{color:var(--accent);background:var(--card);font-weight:800}.nav span{display:block;font-size:18px}.hidden{display:none!important}.overlay{position:fixed;inset:0;z-index:8;background:#000a;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(100%,620px);max-height:90dvh;overflow:auto}.modalhead,.modalfoot{display:flex;justify-content:space-between;gap:8px;align-items:center}.modalhead h2{font-size:19px;margin:0}.modalfoot{margin-top:16px}.modalfoot button{flex:1}.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 8px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card2);border-radius:14px;padding:14px}.stat strong{display:block;font-size:21px}.stat span{color:var(--muted);font-size:12px}.toast{position:fixed;z-index:15;bottom:95px;left:50%;transform:translateX(-50%);background:#f3f7fa;color:#101820;padding:11px 16px;border-radius:12px;max-width:90%}@media(min-width:600px){.app{padding:24px}.overlay{align-items:center}}
</style></head><body><main id="app" class="app"><div class="empty">Cargando…</div></main><nav id="nav" class="nav hidden"></nav><div id="toast" class="toast hidden" role="status"></div><input id="invoicefile" type="file" accept="application/pdf,image/*" capture="environment" class="hidden">
<script>
'use strict';
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0), today=()=>new Date().toISOString().slice(0,10), uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dbp=new Promise((ok,no)=>{let q=indexedDB.open('bola8-compras',1);q.onupgradeneeded=()=>['settings','products','suppliers','purchases'].forEach(s=>{if(!q.result.objectStoreNames.contains(s))q.result.createObjectStore(s,{keyPath:'id'})});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
async function all(s){let d=await dbp;return new Promise((ok,no)=>{let q=d.transaction(s).objectStore(s).getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}async function get(s,id){let d=await dbp;return new Promise((ok,no)=>{let q=d.transaction(s).objectStore(s).get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}async function put(s,v){let d=await dbp;return new Promise((ok,no)=>{let q=d.transaction(s,'readwrite').objectStore(s).put(v);q.onsuccess=()=>ok(v);q.onerror=()=>no(q.error)})}async function del(s,id){let d=await dbp;return new Promise((ok,no)=>{let q=d.transaction(s,'readwrite').objectStore(s).delete(id);q.onsuccess=()=>ok();q.onerror=()=>no(q.error)})}
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join(''), setting=async id=>(await get('settings',id))?.value, setsetting=(id,v)=>put('settings',{id,value:v});
let page='Inicio',search='',session=false;
const toast=s=>{let e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2600)}, online=()=>navigator.onLine;
function calc(p){let base=0,vat=0;(p.lines||[]).forEach(l=>{let b=Number(l.qty)*Number(l.price);base+=b;vat+=b*Number(l.vat)/100});return{base,vat,total:base+vat}}
async function active(){return(await all('purchases')).find(p=>p.status==='pending')||null}
function nav(){let a=[['Inicio','⌂'],['Productos','▦'],['Proveedores','♙'],['Historial','◷'],['Estadísticas','▥']];$('#nav').innerHTML=a.map(x=>'<button data-page="'+x[0]+'" class="'+(page===x[0]?'active':'')+'"><span>'+x[1]+'</span>'+x[0]+'</button>').join('');$('#nav').classList.toggle('hidden',!session)}
function shell(c){$('#app').innerHTML='<header class="top"><div><div class="brand"><b>●</b> Bola 8 Compras</div><div class="muted">Control de compras del negocio</div></div><span class="pill">LOCAL</span></header>'+c;nav()}
async function render(){if(!session)return gate();nav();if(page==='Inicio')return home();if(page==='Productos')return productsPage();if(page==='Proveedores')return suppliersPage();if(page==='Historial')return historyPage();return statsPage()}
async function gate(){session=false;$('#nav').classList.add('hidden');let pin=await setting('pin');if(!pin){$('#app').innerHTML='<div class="card hero"><div class="brand"><b>●</b> Bola 8 Compras</div><h1>Configura tu acceso</h1><p class="muted">Crea un PIN de 4 cifras. Guarda el código de recuperación fuera del móvil.</p><form id="setup"><div class="field"><label>PIN nuevo</label><input id="pin1" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div><div class="field"><label>Repite el PIN</label><input id="pin2" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div><button class="primary" style="width:100%">Crear acceso</button></form><div id="recoverbox" class="hidden"></div></div>';$('#setup').onsubmit=async e=>{e.preventDefault();let a=$('#pin1').value,b=$('#pin2').value;if(!/^\d{4}$/.test(a)||a!==b)return toast('El PIN debe tener 4 cifras iguales en ambos campos.');let code=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();await setsetting('pin',await hash(a));await setsetting('recovery',await hash(code));$('#setup').classList.add('hidden');let box=$('#recoverbox');box.classList.remove('hidden');box.innerHTML='<div class="notice warn"><b>Guarda este código ahora:</b><br><strong style="font-size:20px;letter-spacing:2px">'+code+'</strong><br>Si olvidas el PIN, lo necesitarás.</div><button id="continue" class="primary" style="width:100%;margin-top:12px">He guardado el código</button>';$('#continue').onclick=()=>{session=true;page='Inicio';render()}};return}
$('#app').innerHTML='<div class="card hero"><div class="brand"><b>●</b> Bola 8 Compras</div><h1>Bienvenido</h1><p class="muted">Introduce tu PIN para continuar.</p><form id="login"><div class="field"><label>PIN de 4 cifras</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div><p id="lockmsg" class="muted"></p><button class="primary" style="width:100%">Entrar</button></form><button id="recover" style="width:100%;margin-top:10px">Recuperar PIN</button><form id="recoverform" class="hidden"><div class="field"><label>Código de recuperación</label><input id="code" required></div><div class="field"><label>Nuevo PIN de 4 cifras</label><input id="newpin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div><button class="primary" style="width:100%">Restablecer PIN</button></form></div>';
$('#login').onsubmit=async e=>{e.preventDefault();if(Number(await setting('lockUntil')||0)>Date.now())return toast('Bloqueado. Espera un minuto.');if(await hash($('#pin').value)===await setting('pin')){await setsetting('attempts',0);await setsetting('lockUntil',0);session=true;await render()}else{let n=Number(await setting('attempts')||0)+1;await setsetting('attempts',n);if(n>=5){await setsetting('attempts',0);await setsetting('lockUntil',Date.now()+60000);$('#lockmsg').textContent='Demasiados intentos. Espera un minuto.'}else $('#lockmsg').textContent='PIN incorrecto: intento '+n+' de 5.'}};
$('#recover').onclick=()=>$('#recoverform').classList.toggle('hidden');$('#recoverform').onsubmit=async e=>{e.preventDefault();if(!/^\d{4}$/.test($('#newpin').value))return toast('El PIN debe tener 4 cifras.');if(await hash($('#code').value.trim().toUpperCase())!==await setting('recovery'))return toast('Código incorrecto.');await setsetting('pin',await hash($('#newpin').value));await setsetting('attempts',0);await setsetting('lockUntil',0);toast('PIN actualizado. Entra con el nuevo PIN.');$('#recoverform').classList.add('hidden')}}
async function home(){let p=await active();shell('<section class="card hero"><div class="muted">'+(p?'COMPRA EN CURSO':'PANEL DE COMPRAS')+'</div><h1>'+(p?'Compra pendiente':'¿Empezamos una compra?')+'</h1>'+(p?'<p class="muted">'+esc(p.supplierName)+' · '+p.lines.length+' líneas</p><div class="total"><span>Total con IVA estimado</span><span>'+money(calc(p).total)+'</span></div><div class="actions" style="margin-top:14px"><button class="primary" data-act="openpurchase">Continuar compra</button><button data-act="closepurchase">Cerrar compra</button></div>':'<p class="muted">Crea una compra y añade productos del catálogo.</p><button class="primary" style="width:100%;margin-top:10px" data-act="newpurchase">＋ Nueva compra</button>')+'</section><div class="notice warn">Los datos se guardan en este navegador. Exporta copias regularmente. La lectura automática de facturas aún no está disponible.</div>')}
async function productsPage(){let list=(await all('products')).filter(p=>p.active!==false&&(p.name+' '+p.category).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.category.localeCompare(b.category,'es')||a.name.localeCompare(b.name,'es'));shell('<div class="row"><input id="search" placeholder="Buscar producto…" value="'+esc(search)+'"><button class="primary" data-act="newproduct">＋ Añadir</button></div><div class="sectionhead"><h2>Catálogo</h2><span class="pill">'+list.length+' productos</span></div>'+(list.length?list.map(p=>'<section class="card"><div class="item"><div class="itemmain"><div class="itemname">'+esc(p.name)+'</div><div class="muted">'+esc(p.category)+' · '+esc(p.format)+' · IVA '+p.vat+'%</div></div><strong class="price">'+(p.price==null?'—':money(p.price))+'</strong><button data-act="editproduct" data-id="'+p.id+'">Editar</button></div></section>').join(''):'<div class="card empty">No hay productos. Añade el catálogo para empezar.</div>')+'<div class="notice">Los precios se incorporarán desde facturas confirmadas; la importación automática aún no está implementada.</div>')}
async function suppliersPage(){let list=(await all('suppliers')).sort((a,b)=>a.name.localeCompare(b.name,'es'));shell('<div class="sectionhead"><h2>Proveedores</h2><button class="primary" data-act="newsupplier">＋ Añadir</button></div>'+(list.length?'<section class="card">'+list.map(s=>'<div class="item"><div class="itemmain"><div class="itemname">'+esc(s.name)+'</div><div class="muted">'+esc(s.taxId||'Sin CIF/NIF')+' · '+esc(s.address||'Sin dirección')+'</div></div><button data-act="editsupplier" data-id="'+s.id+'">Editar</button></div>').join('')+'</section>':'<div class="card empty">Añade el primer proveedor.</div>'))}
async function historyPage(){let list=(await all('purchases')).filter(p=>p.status==='closed').sort((a,b)=>b.date.localeCompare(a.date));list=list.filter(p=>!search||p.date.includes(search)||(p.supplierName||'').toLowerCase().includes(search.toLowerCase())||String(p.number).includes(search));shell('<div class="sectionhead"><h2>Historial</h2><button data-act="exportcsv">Exportar CSV</button></div><input id="search" placeholder="Buscar proveedor o fecha…" value="'+esc(search)+'">'+(list.map(p=>'<section class="card"><div class="row"><div class="itemmain"><div class="itemname">Compra #'+p.number+' · '+esc(p.supplierName)+'</div><div class="muted">'+p.date+' · '+p.lines.length+' líneas</div></div><strong>'+money(p.actualTotal)+'</strong></div><button style="margin-top:10px" data-act="viewpurchase" data-id="'+p.id+'">Ver detalle</button></section>').join('')||'<div class="card empty">Todavía no hay compras cerradas.</div>'))}
async function statsPage(){let ps=(await all('purchases')).filter(p=>p.status==='closed'),spend=ps.reduce((a,p)=>a+Number(p.actualTotal||0),0),vat=ps.reduce((a,p)=>a+calc(p).vat,0),by={};ps.forEach(p=>by[p.supplierName]=(by[p.supplierName]||0)+Number(p.actualTotal||0));shell('<div class="sectionhead"><h2>Estadísticas</h2><span class="pill">'+ps.length+' compras</span></div><div class="statgrid"><div class="stat"><span>Gasto total</span><strong>'+money(spend)+'</strong></div><div class="stat"><span>IVA estimado</span><strong>'+money(vat)+'</strong></div></div><div class="sectionhead"><h2>Gasto por proveedor</h2></div><section class="card">'+(Object.entries(by).sort((a,b)=>b[1]-a[1]).map(x=>'<div class="item"><div class="itemmain">'+esc(x[0])+'</div><strong>'+money(x[1])+'</strong></div>').join('')||'<div class="empty">Los datos aparecerán al cerrar compras.</div>')+'</section><div class="notice warn">El desglose de IVA es orientativo hasta implementar la validación con facturas.</div><div class="actions"><button data-act="backup">Exportar copia JSON</button><button data-act="exportcsv">Exportar CSV</button></div>')}
function modal(title,body){$('#overlay')?.remove();let e=document.createElement('div');e.id='overlay';e.className='overlay';e.innerHTML='<section class="modal"><div class="modalhead"><h2>'+title+'</h2><button data-act="dismiss">✕</button></div>'+body+'</section>';document.body.append(e);return e}
async function productForm(id){if(!online())return toast('Para modificar datos necesitas conexión.');let old=id?await get('products',id):null,m=modal(old?'Editar producto':'Nuevo producto','<form id="form"><div class="field"><label>Nombre</label><input name="name" required value="'+esc(old?.name||'')+'"></div><div class="field"><label>Categoría</label><select name="category">'+['Bebidas','Alimentación','Limpieza','Otros'].map(c=>'<option '+(old?.category===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="field"><label>Formato habitual</label><input name="format" required placeholder="Caja de 24, botella 1 L…" value="'+esc(old?.format||'')+'"></div><div class="field"><label>IVA habitual</label><select name="vat">'+[0,4,5,10,21].map(v=>'<option value="'+v+'" '+(Number(old?.vat??21)===v?'selected':'')+'>'+v+'%</option>').join('')+'</select></div><div class="field"><label>Código o referencia (opcional)</label><input name="code" value="'+esc(old?.code||'')+'"></div><p class="muted">El precio no se introduce aquí; deberá proceder de una factura confirmada.</p><div class="modalfoot"><button type="button" data-act="dismiss">Cancelar</button><button class="primary">Guardar</button></div></form>');$('#form',m).onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;let dupe=(await all('products')).find(p=>p.id!==id&&p.name.toLowerCase()===name.toLowerCase());if(dupe)return toast('Ya existe un producto con ese nombre.');await put('products',{id:old?.id||uid(),name,category:f.get('category'),format:String(f.get('format')).trim(),vat:Number(f.get('vat')),code:String(f.get('code')).trim(),price:old?.price??null,active:true});m.remove();render()}}
async function supplierForm(id){if(!online())return toast('Para modificar datos necesitas conexión.');let old=id?await get('suppliers',id):null,m=modal(old?'Editar proveedor':'Nuevo proveedor','<form id="form"><div class="field"><label>Nombre comercial</label><input name="name" required value="'+esc(old?.name||'')+'"></div><div class="field"><label>CIF/NIF</label><input name="taxId" value="'+esc(old?.taxId||'')+'"></div><div class="field"><label>Dirección fiscal</label><textarea name="address" rows="2">'+esc(old?.address||'')+'</textarea></div><div class="modalfoot"><button type="button" data-act="dismiss">Cancelar</button><button class="primary">Guardar</button></div></form>');$('#form',m).onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;await put('suppliers',{id:old?.id||uid(),name,taxId:String(f.get('taxId')).trim(),address:String(f.get('address')).trim(),active:true});m.remove();render()}}
async function newPurchase(){if(!online())return toast('Para modificar datos necesitas conexión.');if(await active())return toast('Ya hay una compra pendiente.');let ss=(await all('suppliers')).filter(s=>s.active!==false);if(!ss.length)return toast('Primero añade un proveedor.');let m=modal('Nueva compra','<form id="form"><div class="field"><label>Proveedor</label><select name="supplier">'+ss.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></div><div class="modalfoot"><button type="button" data-act="dismiss">Cancelar</button><button class="primary">Empezar compra</button></div></form>');$('#form',m).onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),s=ss.find(x=>x.id===f.get('supplier')),ps=await all('purchases'),number=ps.reduce((n,p)=>Math.max(n,Number(p.number)||0),0)+1;await put('purchases',{id:uid(),number,date:today(),supplierId:s.id,supplierName:s.name,status:'pending',lines:[]});m.remove();render()}}
async function purchaseView(id){let p=await get('purchases',id);if(!p)return;let read=p.status==='closed',c=calc(p),body='<p class="muted">'+p.date+' · '+esc(p.supplierName)+' · '+(read?'Cerrada':'Pendiente')+'</p>'+(p.lines.map(l=>'<div class="item"><div class="itemmain"><div class="itemname">'+esc(l.name)+'</div><div class="muted">'+l.qty+' × '+esc(l.format)+' · IVA '+l.vat+'%</div></div><strong>'+money(l.qty*l.price*(1+l.vat/100))+'</strong>'+(read?'':'<button data-act="editline" data-purchase="'+p.id+'" data-id="'+l.id+'">Editar</button>')+'</div>').join('')||'<div class="empty">Añade productos a esta compra.</div>');if(read)body+='<div class="notice">Total factura: '+money(p.actualTotal)+' · Diferencia: '+money(p.difference||0)+'<br>'+esc(p.reason||'')+'</div>';else body+='<div class="actions" style="margin-top:14px"><button class="primary" data-act="addline" data-id="'+p.id+'">＋ Añadir producto</button><button data-act="importinvoice">Importar factura</button></div><div class="total"><span>Total estimado con IVA</span><span>'+money(c.total)+'</span></div><p class="muted">Base orientativa '+money(c.base)+' · IVA estimado '+money(c.vat)+'</p><button class="primary" style="width:100%" data-act="finishpurchase" data-id="'+p.id+'">Cerrar compra</button>';let m=modal('Compra #'+p.number,body);m.dataset.purchase=p.id}
async function lineForm(pid,lid){if(!online())return toast('Para modificar datos necesitas conexión.');let p=await get('purchases',pid),old=p.lines.find(l=>l.id===lid),products=(await all('products')).filter(x=>x.active!==false);if(!products.length)return toast('Añade productos primero.');let m=modal(old?'Editar línea':'Añadir producto','<form id="form"><div class="field"><label>Producto</label><select name="product">'+products.map(x=>'<option value="'+x.id+'" '+(old?.productId===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>Cantidad</label><input name="qty" type="number" min=".001" step=".001" required value="'+(old?.qty||1)+'"></div><div class="field"><label>Precio por formato (€)</label><input name="price" type="number" min="0" step=".0001" required value="'+(old?.price??products[0].price??'')+'"></div><div class="field"><label>IVA (%)</label><select name="vat">'+[0,4,5,10,21].map(v=>'<option value="'+v+'" '+(Number(old?.vat??21)===v?'selected':'')+'>'+v+'%</option>').join('')+'</select></div><p class="notice warn">Importación de factura pendiente: el precio de esta línea se está introduciendo manualmente y no debe considerarse confirmado.</p><div class="modalfoot"><button type="button" data-act="dismiss">Cancelar</button><button class="primary">Guardar línea</button></div></form>');$('#form',m).onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),x=products.find(q=>q.id===f.get('product')),qty=Number(f.get('qty')),price=Number(f.get('price'));if(qty<=0||!Number.isFinite(price)||price<0)return toast('Revisa cantidad y precio.');let l={id:old?.id||uid(),productId:x.id,name:x.name,format:x.format||'Formato habitual',qty,price,vat:Number(f.get('vat'))};if(old)p.lines=p.lines.map(q=>q.id===old.id?l:q);else{let same=p.lines.find(q=>q.productId===l.productId&&q.format===l.format&&q.price===l.price&&q.vat===l.vat);if(same)same.qty+=qty;else p.lines.push(l)}await put('purchases',p);m.remove();purchaseView(pid)}}
async function finishPurchase(id){let p=await get('purchases',id);if(!p.lines.length)return toast('Añade al menos una línea.');let c=calc(p),m=modal('Cerrar compra','<form id="form"><p class="muted">Total calculado orientativo: <b>'+money(c.total)+'</b></p><div class="field"><label>Total real de factura (IVA incluido)</label><input name="actual" type="number" min="0" step=".01" value="'+c.total.toFixed(2)+'" required></div><div class="field"><label>Motivo de diferencia</label><select name="reason"><option value="">Selecciona si hay diferencia</option><option>Precio distinto al esperado</option><option>Descuento aplicado en factura</option><option>Gastos de envío u otros cargos</option><option>Diferencia de IVA o redondeo</option><option>Error al introducir o leer datos</option><option>Otro</option></select></div><div class="field hidden" id="other"><label>Explica el motivo</label><input name="detail"></div><div class="modalfoot"><button type="button" data-act="dismiss">Cancelar</button><button class="primary">Confirmar cierre</button></div></form>');let f=$('#form',m);$('select[name="reason"]',f).onchange=()=>$('#other',m).classList.toggle('hidden',$('select[name="reason"]',f).value!=='Otro');f.onsubmit=async e=>{e.preventDefault();let fd=new FormData(f),actual=Number(fd.get('actual')),diff=Number((actual-c.total).toFixed(2)),reason=String(fd.get('reason')||'');if(Math.abs(diff)>.009&&!reason)return toast('Indica el motivo de la diferencia.');if(reason==='Otro'){reason=String(fd.get('detail')||'').trim();if(!reason)return toast('Explica el motivo.')}p.status='closed';p.actualTotal=actual;p.calculatedTotal=Number(c.total.toFixed(2));p.difference=diff;p.reason=reason;p.closedAt=new Date().toISOString();await put('purchases',p);m.remove();page='Historial';search='';render();toast('Compra cerrada y guardada')}}
async function exportData(json){let d={products:await all('products'),suppliers:await all('suppliers'),purchases:await all('purchases'),exportedAt:new Date().toISOString()},blob,name;if(json){blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});name='bola8-copia-'+today()+'.json'}else{let rows=[['Compra','Fecha','Proveedor','Producto','Formato','Cantidad','Precio','IVA %','Total línea','Total factura','Diferencia','Motivo']];d.purchases.filter(p=>p.status==='closed').forEach(p=>p.lines.forEach(l=>rows.push([p.number,p.date,p.supplierName,l.name,l.format,l.qty,l.price,l.vat,l.qty*l.price*(1+l.vat/100),p.actualTotal,p.difference,p.reason])));blob=new Blob(['\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});name='bola8-compras-'+today()+'.csv'}let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-page],[data-act]');if(!b)return;if(b.dataset.page){page=b.dataset.page;search='';render();return}let a=b.dataset.act,id=b.dataset.id,pid=b.dataset.purchase;try{switch(a){case'dismiss':$('#overlay')?.remove();break;case'newproduct':productForm();break;case'editproduct':productForm(id);break;case'newsupplier':supplierForm();break;case'editsupplier':supplierForm(id);break;case'newpurchase':newPurchase();break;case'openpurchase':{let p=await active();if(p)purchaseView(p.id);break}case'closepurchase':{let p=await active();if(p)finishPurchase(p.id);break}case'addline':lineForm(id);break;case'editline':lineForm(pid,id);break;case'finishpurchase':finishPurchase(id);break;case'viewpurchase':purchaseView(id);break;case'exportcsv':exportData(false);break;case'backup':exportData(true);break;case'importinvoice':$('#invoicefile').click();break}}catch(err){console.error(err);toast('No se pudo completar la acción. Inténtalo de nuevo.')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let p=e.target.selectionStart;render().then(()=>{let n=$('#search');if(n){n.focus();n.setSelectionRange(p,p)}})}});
$('#invoicefile').onchange=e=>{let f=e.target.files?.[0];if(f){modal('Importación de factura','<p><b>'+esc(f.name)+'</b></p><p class="notice warn">La lectura automática de PDF y fotografías aún no está implementada. El archivo no se almacena ni se procesa.</p><button class="primary" style="width:100%;margin-top:14px" data-act="dismiss">Entendido</button>')}e.target.value=''};
window.addEventListener('offline',()=>toast('Sin conexión: los cambios están desactivados'));if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});async function initApp(){
  const suppliers = await all('suppliers');
  if (!suppliers.some(s => String(s.name || '').trim().toLocaleLowerCase('es') === 'cash dian')) {
    await put('suppliers', {id: uid(), name: 'Cash Dian', taxId: '', address: '', active: true});
  }
  await gate();
}
initApp().catch(err => {
  console.error(err);
  $('#app').innerHTML = '<section class="card"><h1>No se ha podido iniciar</h1><p>Ha ocurrido un error al abrir la base de datos local. Cierra y vuelve a abrir la aplicación.</p></section>';
});
</script></body></html>
